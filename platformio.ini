; PlatformIO project: standalone SoftAP message board
; Wemos D1 Mini (ESP8266) + 4-in-1 MAX7219 (FC16) 32x8 LED matrix

[platformio]
default_envs = d1_mini

[env:d1_mini]
platform = espressif8266
board = d1_mini
framework = arduino

monitor_speed = 115200
monitor_filters = esp8266_exception_decoder
upload_speed = 921600

; Settings are persisted to LittleFS (no data folder upload needed;
; the firmware formats/creates the file system on first boot).
board_build.filesystem = littlefs

lib_deps =
    majicdesigns/MD_Parola@^3.7.3
    majicdesigns/MD_MAX72XX@^3.5.1

; The main firmware excludes the diagnostic sketch in src/diag/.
build_src_filter = +<*> -<diag/>

; Wiring finder: `pio run -e diag -t upload -t monitor`
; Cycles CS / DIN / CLK combinations and lights a pattern for the one that works.
[env:diag]
platform = espressif8266
board = d1_mini
framework = arduino
monitor_speed = 115200
upload_speed = 921600
build_src_filter = -<*> +<diag/>
